name: CI/CD Backend Quiz App

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  # ─── JOB 1: Quality Check ─────────────────────────────────────────────────
  # Lint dan test dijalankan SEBELUM deploy.
  # Kalau ada yang gagal, deploy tidak akan jalan.
  quality-check:
    name: Lint & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Run ESLint (Code Quality)
        run: npm run lint

      - name: Run Jest Tests & Coverage
        run: npm run test:coverage

  # ─── JOB 2: Deploy ────────────────────────────────────────────────────────
  # Hanya jalan kalau job "quality-check" di atas BERHASIL semua.
  deploy:
    name: Deploy to Azure
    runs-on: ubuntu-latest
    needs: quality-check  # ← tunggu quality-check selesai & sukses dulu

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'quiz-app-backend'
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: .
